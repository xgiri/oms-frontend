query OrderDetail($id: ID!) {
  orderDetail(id: $id) {
    id
    status
    totalAmount
    customer {
      id
      name
      email
    }
    payment {
      id
      status
      amount
    }
    shipment {
      id
      status
      trackingNumber
    }
    items {
      id
      productId
      productName
      quantity
      unitPrice
      subtotal
    }
    createdAt
    updatedAt
  }
}
